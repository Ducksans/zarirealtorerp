name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Generate Prisma Client
      run: npx prisma generate

    # [Phase 0] 품질 게이트 재가동 — 어떤 단계도 실패를 무시하지 않는다
    - name: Type Check
      run: npx tsc --noEmit

    - name: Lint
      run: npm run lint

    - name: Test (100원 룰 + 정산 시나리오 박제)
      run: npm test
      env:
        DATABASE_URL: "file:./test.db"

    - name: Build Next.js Application
      run: npm run build
      env:
        DATABASE_URL: "file:./dev.db"
